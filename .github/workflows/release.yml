name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun src/entry.ts --help

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Build Linux executables
        run: |
          mkdir -p dist packages
          bun build --compile --target=bun-linux-x64 src/entry.ts --outfile=dist/tracer-linux-x64
          bun build --compile --target=bun-linux-arm64 src/entry.ts --outfile=dist/tracer-linux-arm64
      - name: Package Linux executables
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          package() {
            local source="$1"
            local target="$2"
            local workdir
            workdir="$(mktemp -d)"
            cp "$source" "$workdir/tracer"
            chmod +x "$workdir/tracer"
            tar -czf "packages/tracer_${VERSION}_${target}.tar.gz" -C "$workdir" tracer
          }
          package dist/tracer-linux-x64 linux_amd64
          package dist/tracer-linux-arm64 linux_arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tracer-linux
          path: packages/tracer_*.tar.gz

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Build and sign macOS executables
        run: |
          mkdir -p dist packages
          bun build --compile --target=bun-darwin-x64 src/entry.ts --outfile=dist/tracer-darwin-x64
          bun build --compile --target=bun-darwin-arm64 src/entry.ts --outfile=dist/tracer-darwin-arm64
          codesign --force --sign - dist/tracer-darwin-x64
          codesign --force --sign - dist/tracer-darwin-arm64
      - name: Smoke test native executable
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            dist/tracer-darwin-arm64 --version
          else
            dist/tracer-darwin-x64 --version
          fi
      - name: Package macOS executables
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          package() {
            local source="$1"
            local target="$2"
            local workdir
            workdir="$(mktemp -d)"
            cp "$source" "$workdir/tracer"
            chmod +x "$workdir/tracer"
            tar -czf "packages/tracer_${VERSION}_${target}.tar.gz" -C "$workdir" tracer
          }
          package dist/tracer-darwin-x64 darwin_amd64
          package dist/tracer-darwin-arm64 darwin_arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tracer-macos
          path: packages/tracer_*.tar.gz

  release:
    needs:
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tracer-*
          path: packages
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd packages
          sha256sum tracer_*.tar.gz > checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/tracer_*.tar.gz \
            packages/checksums.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
