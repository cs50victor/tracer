name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NOTE(victor): Re-add after the existing MVP type errors are resolved.
      # - name: TypeScript type check
      #   run: bun run typecheck

      - name: Test
        run: bun test

      - name: CLI smoke test
        run: bun run src/entry.ts --help
